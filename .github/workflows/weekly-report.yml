name: KshKnights weekly report

on:
  schedule:
    - cron: "0 6 * * 1"          # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (blank = today)"
        required: false
  push:
    branches: [main]
    paths:
      - "data/fantasy/**"        # new fantasy export uploaded -> rerun
      - "config/**"              # squad / settings changed -> rerun

permissions:
  contents: write
  issues: write

concurrency:
  group: kshknights-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Offline tests
        run: pip install pytest && python -m pytest -q -W ignore

      - name: Build report
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; fi
          python -u -m kshknights $ARGS 2>&1 | tee run.log
          echo "report=$(grep '^REPORT=' run.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Commit report, cache and price history
        if: always()             # keep downloaded box scores even if the report step failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Generated files only: this run's versions win over anything pushed meanwhile.
          tmp=$(mktemp -d)
          mkdir -p reports data/cache data/history
          cp -r reports "$tmp/reports"; cp -r data/cache "$tmp/cache"; cp -r data/history "$tmp/history"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -r "$tmp/reports/." reports/
            cp -r "$tmp/cache/." data/cache/
            cp -r "$tmp/history/." data/history/
            git add reports data/cache data/history
            if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
            git commit -m "Weekly report $(date -u +%F)"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected, retrying ($attempt)"; sleep 5
          done
          exit 1

      - name: Open issue with the report (GitHub emails you)
        if: success() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create kshknights-report --color 0E8A16 2>/dev/null || true
          gh issue create --title "Fantasy report $(date -u +%F)" \
            --body-file "${{ steps.run.outputs.report }}" --label kshknights-report
